algorithm: yolo
algorithm_params:
  passthrough: {}
  edge:
    low: 60
    high: 150
    blur: 3
  hsv_target:
    h_min: 0
    h_max: 179
    s_min: 80
    s_max: 255
    v_min: 80
    v_max: 255
    min_area: 300
  yolo:
    confidence: 0.5
    show_center: true
inference:
  # RDK X5 Model Zoo YOLO Detect .bin (NV12 input, hbm_runtime backend).
  backend: rdk-hbm
  model: models/yolo11n_bayese_640x640_nv12.bin
  input_size:
  - 640
  - 640
  classes_num: 9
  labels: [apple, avacado, banana, guava, kiwi, mango, orange, peach, pineapple]
  confidence: 0.25
  nms: 0.70
  reg: 16
  strides: [8, 16, 32]
  resize_type: 1
  priority: 0
  bpu_cores: [0]
