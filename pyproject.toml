[project]
name = "rdkx5-vision-gui"
version = "0.1.0"
description = "RDK X5 electronic-design-contest vision debugging platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8",
  "pyserial>=3.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = [
  "PyQt5>=5.15.10",
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
rdkx5-vision = "app.main:main"
rdkx5-probe = "app.tools.environment_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p no:tmpdir"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".uv-cache", ".uv-python"]
